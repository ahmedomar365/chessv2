[package]
name = "chessv2-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# spacetimedb only links under wasm; pure logic (rules, auth) tests run natively
[target.'cfg(target_arch = "wasm32")'.dependencies]
spacetimedb = "2.5"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[profile.release]
opt-level = "z"
